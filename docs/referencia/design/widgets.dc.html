<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prumo — Widgets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&display=swap">
<style>
body{margin:0}
a{color:#16213A}a:hover{color:#2B3A60}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #34456B; color: #16213A; font-family: 'Recursive', system-ui, sans-serif; font-variation-settings: 'CASL' 0, 'MONO' 0; padding: 26px 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
    <section aria-label="Widget pequeno" style="height: 170px; box-sizing: border-box; border-radius: 26px; background-color: #FBFCFE; background-image: linear-gradient(#E4EAF3 1px, transparent 1px), linear-gradient(90deg, #E4EAF3 1px, transparent 1px); background-size: 16px 16px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between">
      <span style="font-variation-settings: 'MONO' 1; font-size: 11px; font-weight: 600; color: #D9361E">AGORA · 32 MIN</span>
      <span style="font-size: 16px; font-weight: 800; line-height: 1.2"><span style="background: linear-gradient(transparent 52%, #FFE45C 52%, #FFE45C 92%, transparent 92%)">Lista 3 de Cálculo</span></span>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 12px; font-weight: 600; color: #4A5672">depois: 16:30</span>
        <button aria-label="Adicionar" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #16213A; color: #FFE45C; display: grid; place-items: center">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </section>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-content: center">
      <sc-for list="{{apps}}" as="a" hint-placeholder-count="4">
        <span style="display: flex; flex-direction: column; align-items: center; gap: 5px">
          <span style="width: 58px; height: 58px; border-radius: 18px; background: {{a.bg}}; display: grid; place-items: center; font-variation-settings: 'CASL' 1; font-weight: 900; font-size: 22px; color: #16213A">{{a.mark}}</span>
          <span style="font-size: 12px; font-weight: 600; color: #FFFFFF">{{a.name}}</span>
        </span>
      </sc-for>
    </div>
  </div>

  <section aria-label="Widget médio" style="height: 172px; box-sizing: border-box; border-radius: 26px; background: #FBFCFE; padding: 14px 10px 12px 16px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-variation-settings: 'CASL' 1; font-size: 17px; font-weight: 900">Hoje<span style="color: #D9361E">.</span> <span style="font-variation-settings: 'MONO' 1; font-size: 11px; font-weight: 600; color: #4A5672">QUA 28</span></span>
      <span style="display: flex; gap: 6px">
        <button aria-label="Falar" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid #16213A; background: #FFFFFF; color: #16213A; display: grid; place-items: center">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button aria-label="Adicionar" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #16213A; color: #FFE45C; display: grid; place-items: center">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </span>
    </div>
    <sc-for list="{{mid}}" as="m" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: 44px 44px minmax(0, 1fr); align-items: center; height: 34px">
        <button aria-label="Concluir {{m.title}}" style="width: 44px; height: 34px; border: 0; background: transparent; display: grid; place-items: center; padding: 0">
          <span style="width: 18px; height: 18px; border: 2.2px solid #16213A; border-radius: 4px"></span>
        </button>
        <span style="font-variation-settings: 'MONO' 1; font-size: 11px; font-weight: 600; color: #4A5672">{{m.t}}</span>
        <span style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="background: linear-gradient(transparent 55%, {{m.hl}} 55%, {{m.hl}} 92%, transparent 92%)">{{m.title}}</span></span>
      </div>
    </sc-for>
  </section>

  <section aria-label="Widget grande" style="flex: 1; box-sizing: border-box; border-radius: 26px; background-color: #FBFCFE; background-image: linear-gradient(#E4EAF3 1px, transparent 1px), linear-gradient(90deg, #E4EAF3 1px, transparent 1px); background-size: 18px 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden">
    <span aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 62px; width: 2px; background: #F2A3A3"></span>
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding-left: 58px">
      <span style="font-variation-settings: 'CASL' 1; font-size: 24px; font-weight: 900">Quarta, 28</span>
      <span style="font-size: 12px; font-weight: 700; color: #4A5672">2h15 de tarefas</span>
    </div>
    <sc-for list="{{big}}" as="b" hint-placeholder-count="5">
      <div style="display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 12px; align-items: center">
        <span style="font-variation-settings: 'MONO' 1; font-size: 12px; font-weight: 600; color: {{b.tc}}; text-align: right">{{b.t}}</span>
        <span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="background: linear-gradient(transparent 55%, {{b.hl}} 55%, {{b.hl}} 92%, transparent 92%)">{{b.title}}</span></span>
      </div>
    </sc-for>
    <div style="margin-top: auto; margin-left: 58px; border: 2px solid #16213A; border-radius: 4px; box-shadow: 3px 3px 0 #16213A; background: #FFFFFF; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 13px; font-weight: 700">Prazos: Lista 3 · <span style="color: #D9361E">ter</span> · P1 · <span style="color: #D9361E">11/11</span></span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const Y = '#FFE45C', B = '#A9DCFF', P = '#FFB8DA';
    return {
      apps: [
        { name: 'Prumo', mark: 'P', bg: '#FFE45C' }, { name: 'Câmera', mark: '', bg: '#C9D2E3' },
        { name: 'Fotos', mark: '', bg: '#C9D2E3' }, { name: 'Arquivos', mark: '', bg: '#C9D2E3' }
      ],
      mid: [
        { t: '15:40', title: 'Lista 3 de Cálculo', hl: Y },
        { t: '16:30', title: 'Ler capítulo 4 · Algoritmos', hl: Y },
        { t: '19:00', title: 'Grupo de estudos', hl: P }
      ],
      big: [
        { t: '14:00', title: 'Cálculo I · B-204', hl: B, tc: '#4A5672' },
        { t: '15:40', title: 'Lista 3 de Cálculo', hl: Y, tc: '#D9361E' },
        { t: '16:30', title: 'Ler capítulo 4 · Algoritmos', hl: Y, tc: '#4A5672' },
        { t: '19:00', title: 'Grupo de estudos', hl: P, tc: '#4A5672' },
        { t: '20:15', title: 'Relatório de Física', hl: Y, tc: '#4A5672' }
      ]
    };
  }
}
</script>
</body>
</html>
